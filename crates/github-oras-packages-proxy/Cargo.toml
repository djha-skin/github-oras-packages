[package]
name = "github-oras-packages-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A small Rust proxy that serves package-manager repositories from OCI artifacts."
publish = false

[lints]
workspace = true

[dependencies]
bytes = { version = "=1.12.1", default-features = false, features = ["std"] }
http-body-util = { version = "=0.1.5", default-features = false }
hyper = { version = "=1.11.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["server", "service", "tokio"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal"] }
